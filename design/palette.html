<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoYellow palette</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px; background: #fff; color: #000; text-align: center; }
  .g { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .sw { border-radius: 20px; padding: 18px; height: 100px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #D9D9D9; }
  .hero { margin: 24px 0; border-radius: 28px; padding: 28px; color: #fff; background: linear-gradient(135deg, #000, #3A3A3A); }
  .b { display: inline-block; padding: 8px 14px; border-radius: 999px; font-weight: 900; letter-spacing: 1px; margin: 4px; border: 2px solid #000; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } .b { border-color: #fff; } }
</style>
<h1>GoYellow palette</h1>
<div class="g">
  <div class="sw" style="background:#000;color:#fff"><b>Black</b><span>#000000</span></div>
  <div class="sw" style="background:#3A3A3A;color:#fff"><b>Charcoal</b><span>#3A3A3A</span></div>
  <div class="sw" style="background:#5A5A5A;color:#fff"><b>Gray</b><span>#5A5A5A</span></div>
  <div class="sw" style="background:#D9D9D9;color:#000"><b>Line</b><span>#D9D9D9</span></div>
  <div class="sw" style="background:#F2F2F2;color:#000"><b>Mist</b><span>#F2F2F2</span></div>
  <div class="sw" style="background:#fff;color:#000"><b>White</b><span>#FFFFFF</span></div>
  <div class="sw" style="background:#B00020;color:#fff"><b>Danger</b><span>#B00020</span></div>
</div>
<div class="hero"><div style="font-size:72px;font-weight:900">5 <span style="font-size:28px">min</span></div>Likely between 4 and 7 min</div>
<span class="b" style="background:#000;color:#fff">● LIVE</span>
<span class="b">◷ RECENT</span>
<span class="b" style="border-style:dashed">◇ ESTIMATE</span>
<span class="b" style="background:#F2F2F2;border-color:transparent">? NO DATA</span>
<p>Status uses fill style, an icon and text, never color.</p>
</html>
