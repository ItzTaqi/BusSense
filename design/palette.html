<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoYellow palette</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:24px;background:#F4F7FF;color:#0B1B3F}
h1{margin:0 0 16px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sw{border-radius:20px;padding:20px;height:110px;display:flex;flex-direction:column;justify-content:space-between}
.hero{margin:24px 0;border-radius:28px;padding:28px;color:#fff;background:linear-gradient(135deg,#0B1B3F,#2E6BFF)}
.badge{display:inline-block;padding:8px 14px;border-radius:999px;font-weight:900;letter-spacing:1px;margin-right:8px}
@media (prefers-color-scheme:dark){body{background:#070F26;color:#F2F6FF}}</style>
<h1>GoYellow palette</h1><div class="g"><div class="sw" style="background:#FFD60A;color:#0B1B3F"><b>Sun</b><span>#FFD60A</span></div><div class="sw" style="background:#0B1B3F;color:#fff"><b>Navy</b><span>#0B1B3F</span></div><div class="sw" style="background:#2E6BFF;color:#fff"><b>Blue</b><span>#2E6BFF</span></div><div class="sw" style="background:#8B5CF6;color:#fff"><b>Violet</b><span>#8B5CF6</span></div><div class="sw" style="background:#14D6A0;color:#0B1B3F"><b>Mint</b><span>#14D6A0</span></div><div class="sw" style="background:#FF9F1C;color:#0B1B3F"><b>Amber</b><span>#FF9F1C</span></div><div class="sw" style="background:#FF4D6D;color:#fff"><b>Coral</b><span>#FF4D6D</span></div></div>
<div class="hero"><div style="font-size:72px;font-weight:900">5 <span style="font-size:28px">min</span></div>
Likely between 4 and 7 min</div>
<span class="badge" style="background:#14D6A0;color:#0B1B3F">● LIVE</span>
<span class="badge" style="background:#FF9F1C;color:#0B1B3F">◷ RECENT</span>
<span class="badge" style="background:#8B5CF6;color:#fff">◇ ESTIMATE</span>
<span class="badge" style="background:#EAF0FF;color:#0B1B3F">? NO DATA</span>
<p>Every status uses color, an icon and text together.</p></html>
