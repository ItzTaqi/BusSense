<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoNC palette</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px; background: #fff; color: #000; text-align: center; }
  .g { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .sw { border-radius: 20px; padding: 18px; height: 100px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #D9D9D9; }
  .hero { margin: 24px 0; border-radius: 28px; padding: 28px; color: #fff; background: linear-gradient(135deg, #1F6BFF, #0B3FBF); }
  .b { display: inline-block; padding: 8px 14px; border-radius: 999px; font-weight: 900; letter-spacing: 1px; margin: 4px; border: 2px solid #1F6BFF; color:#1F6BFF; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } .b { border-color: #fff; } }
</style>
<h1>GoNC palette</h1>
<div class="g">
  <div class="sw" style="background:#1F6BFF;color:#fff"><b>Blue</b><span>#1F6BFF</span></div>
  <div class="sw" style="background:#0B3FBF;color:#fff"><b>Deep blue</b><span>#0B3FBF</span></div>
  <div class="sw" style="background:#5B6B8C;color:#fff"><b>Slate</b><span>#5B6B8C</span></div>
  <div class="sw" style="background:#DCE6F7;color:#0B1220"><b>Line</b><span>#DCE6F7</span></div>
  <div class="sw" style="background:#F1F6FF;color:#0B1220"><b>Mist</b><span>#F1F6FF</span></div>
  <div class="sw" style="background:#fff;color:#000"><b>White</b><span>#FFFFFF</span></div>
  <div class="sw" style="background:#B00020;color:#fff"><b>Danger</b><span>#B00020</span></div>
</div>
<div class="hero"><div style="font-size:72px;font-weight:900">5 <span style="font-size:28px">min</span></div>Likely between 4 and 7 min</div>
<span class="b" style="background:#1F6BFF;color:#fff">● LIVE</span>
<span class="b">◷ RECENT</span>
<span class="b" style="border-style:dashed">◇ ESTIMATE</span>
<span class="b" style="background:#F1F6FF;border-color:transparent">? NO DATA</span>
<p>Status uses fill style, an icon and text, never color.</p>
</html>
